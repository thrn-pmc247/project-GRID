# Git hooks. All local hooks run through uv/Python so they work identically
# in PowerShell on Windows and in POSIX shells (no bash hook scripts — see
# docs/context/environment.md).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: context-gate
        name: context hygiene gate (scripts/check_context.py)
        entry: uv run python scripts/check_context.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy (src)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/
