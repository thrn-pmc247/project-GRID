[project]
name = "grid"
version = "0.1.0"
description = "Project GRID — GP Registry & Intelligence Database. PMCare provider-discovery pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — PMCare Sdn Bhd internal" }
authors = [{ name = "PMCare Provider Network Management" }]
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "phonenumbers>=8.13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "typer>=0.12",
    "openpyxl>=3.1",
    # Promoted from the `perf` extra 2026-08-17: parquet reading is load-bearing for the
    # PR001 incumbent-master path (bronze loader, profiler), and CI's `uv sync
    # --all-groups` does not install extras. pandas 3.x here has no pyarrow and cannot
    # read parquet; pyarrow is deliberately NOT added — one parquet stack only.
    # See docs/reconciliation-pr001.md §6 and ADR 0006.
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
grid = "grid.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/grid/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/grid"]
exclude = ["src/grid/db/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
