# Local development database — Postgres 16 + PostGIS.
# Usage: docker compose up -d db     (see docs/context/environment.md)
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: grid-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grid_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-grid}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grid} -d ${POSTGRES_DB:-grid}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  grid_pgdata:
